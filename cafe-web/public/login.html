<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · On Top Gaming</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="card login-card">
      <div class="brand"><span class="logo">▲</span> On Top Gaming</div>
      <p class="muted small">Café dashboard. Accounts are created by the owner; there is no sign-up.</p>
      <form id="login-form" novalidate>
        <label>Username
          <input id="username" name="username" autocomplete="username" required maxlength="64" autofocus>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
        </label>
        <p id="login-error" class="error small" role="alert" hidden></p>
        <button class="primary" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
